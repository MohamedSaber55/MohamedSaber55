<svg xmlns="http://www.w3.org/2000/svg" width="320" height="56" viewBox="0 0 320 56" role="img" aria-label="Request a Consultation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#D97706"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="4" y="4" width="312" height="48" rx="14" fill="url(#bg)"/>
    <rect x="4.5" y="4.5" width="311" height="47" rx="13.5" fill="none" stroke="#FCD34D" stroke-opacity="0.45"/>
  </g>
  <text x="160" y="35" text-anchor="middle" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#0B1020" letter-spacing="0.2">Request a Consultation</text>
  <text x="292" y="35" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#0B1020">→</text>
</svg>
