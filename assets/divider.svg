<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="14" viewBox="0 0 1200 14" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F59E0B" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#F59E0B" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#F59E0B" stop-opacity="0.9"/>
      <stop offset="0.8" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F59E0B" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#F59E0B" stop-opacity="1"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="6.5" width="1200" height="1" fill="#1F2937"/>
  <rect x="0" y="6" width="1200" height="2" rx="1" fill="url(#line)" opacity="0.7"/>
  <rect x="-240" y="5" width="240" height="4" rx="2" fill="url(#sweep)">
    <animate attributeName="x" from="-240" to="1200" dur="4.5s" repeatCount="indefinite"/>
  </rect>
  <circle cx="600" cy="7" r="2.5" fill="#F59E0B" opacity="0.9">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>
