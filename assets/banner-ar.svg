<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="محمد صابر — مهندس برمجيات">
  <defs>
    <linearGradient id="bg" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#FCD34D"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#1F2937" stroke-width="1" opacity="0.7"/>
    </pattern>
    <clipPath id="c"><rect width="1200" height="300" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <circle cx="180" cy="40" r="180" fill="#38BDF8" opacity="0.08"/>
    <circle cx="1050" cy="260" r="220" fill="#F59E0B" opacity="0.10"/>
  </g>
  <rect x="0.75" y="0.75" width="1198.5" height="298.5" rx="22" fill="none" stroke="#1F2937"/>
  <rect x="1" y="1" width="1198" height="298" rx="21" fill="none" stroke="url(#accent)" stroke-opacity="0.35"/>

  <g direction="rtl">
    <text x="1150" y="110" text-anchor="end" font-family="'Segoe UI', Tahoma, 'Noto Sans Arabic', Arial, sans-serif" font-size="56" font-weight="800" fill="#F9FAFB">محمد صابر</text>
    <text x="1150" y="160" text-anchor="end" font-family="'Segoe UI', Tahoma, 'Noto Sans Arabic', Arial, sans-serif" font-size="30" font-weight="700" fill="url(#gold)">مهندس برمجيات</text>
    <text x="1150" y="200" text-anchor="end" font-family="'Segoe UI', Tahoma, 'Noto Sans Arabic', Arial, sans-serif" font-size="20" fill="#93C5FD">تطبيقات ويب · أنظمة Odoo ERP · روبوتات محادثة بالذكاء الاصطناعي</text>
    <text x="1150" y="234" text-anchor="end" font-family="'Segoe UI', Tahoma, 'Noto Sans Arabic', Arial, sans-serif" font-size="16" fill="#9CA3AF">حلول رقمية موثوقة وقابلة للتوسع للشركات في مصر ودول الخليج</text>
  </g>

  <g transform="translate(50,70)">
    <rect width="360" height="160" rx="16" fill="#0F172A" fill-opacity="0.8" stroke="#1F2937"/>
    <text x="24" y="40" font-family="ui-monospace, Consolas, monospace" font-size="13" fill="#6B7280">capabilities</text>
    <g font-family="'Segoe UI', Tahoma, Arial, sans-serif" font-size="15" fill="#E5E7EB">
      <text x="24" y="74">• منصات ويب ولوحات تحكم</text>
      <text x="24" y="102">• تخصيص وربط أنظمة Odoo</text>
      <text x="24" y="130">• واجهات عربية/إنجليزية RTL</text>
    </g>
  </g>
</svg>
